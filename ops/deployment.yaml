apiVersion: apps/v1
kind: Deployment
metadata:
  name: scimappdeployment
  labels:
    app: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: nginx
        image: gopalsub/scim:v1
        ports:
        - containerPort: 80

  